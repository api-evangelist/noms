aid: noms

name: Noms

image: https://noms.sh/og-image.png

description: Noms provides a comprehensive nutrition data API covering 3.7 million foods and 298,000 brands across 230 countries. The service
  offers detailed nutrient information, barcode lookup, and food images, all accessible via a RESTful interface. It includes a free tier with
  no credit card required, extensive documentation, and support resources to help developers integrate nutritional data into applications.

