    points at.
  humanURL: https://noms.sh/docs
  baseURL: https://api.noms.sh/v1
  tags:
  - brands
  properties:
  - type: OpenAPI
    url: openapi/noms-brands-api-openapi.yml
- aid: noms:noms-foodgroups-api
  name: Noms Food Groups API
  description: The canonical food-group catalog.
  humanURL: https://noms.sh/docs
  baseURL: https://api.noms.sh/v1
  tags:
  - foodGroups
  properties:
  - type: OpenAPI
    url: openapi/noms-foodgroups-api-openapi.yml
- aid: noms:noms-foods-api
  name: Noms Foods API
  description: >-
    The food catalog. Search, filter, sort, and embed related brand / food-group / nutrient detail via
    `include=`.
  humanURL: https://noms.sh/docs
  baseURL: https://api.noms.sh/v1
  tags:
  - foods
  properties:
  - type: OpenAPI
    url: openapi/noms-foods-api-openapi.yml
- aid: noms:noms-market-api
  name: Noms Market API
  description: >-
    Read and set your account's market. Free-tier accounts serve one chosen market, shared by every key
    they own; set it before querying foods (paid plans serve all markets).
  humanURL: https://noms.sh/docs
  baseURL: https://api.noms.sh/v1
  tags:
  - market
  properties:
  - type: OpenAPI
    url: openapi/noms-market-api-openapi.yml
- aid: noms:noms-nutrients-api
  name: Noms Nutrients API
  description: The canonical nutrient catalog (codes, units, hierarchy).
  humanURL: https://noms.sh/docs
  baseURL: https://api.noms.sh/v1
  tags:
  - nutrients
  properties:
  - type: OpenAPI
    url: openapi/noms-nutrients-api-openapi.yml
- aid: noms:noms-usage-api
  name: Noms Usage API
  description: >-
    Your **account's** usage against its quota for the current window — the total across every key you
    hold, which is what enforcement compares against. Poll it to see where you stand before hitting the
    limit.
  humanURL: https://noms.sh/docs
  baseURL: https://api.noms.sh/v1
  tags:
  - usage
  properties:
  - type: OpenAPI
    url: openapi/noms-usage-api-openapi.yml
